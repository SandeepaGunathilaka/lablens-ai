[pytest]
pythonpath = .
testpaths = tests
markers =
    embedding_integration: optional real-model test; requires RUN_EMBEDDING_INTEGRATION=1
    vector_store_integration: optional real-model Chroma test; requires RUN_VECTOR_STORE_INTEGRATION=1
    semantic_retriever_integration: optional ranked semantic smoke test; requires RUN_SEMANTIC_RETRIEVER_INTEGRATION=1
